# ══════════════════════════════════════════════════════════════════════════════
# FableScript NPC Definitions — npcs.yml
# Define all server NPCs here. Dialogue trees live in dialogues/<file>.yml
# ══════════════════════════════════════════════════════════════════════════════

npcs:

  # ── Merchant Thomas ────────────────────────────────────────────────────────
  merchant_thomas:
    display-name: "Thomas the Merchant"
    personality: Greedy       # Noble | Greedy | Vengeful | Idealistic | Pragmatic
    starting-relationship: 0  # -100 (hostile) to +100 (devoted)
    dialogue-tree: merchant_thomas.yml
    quests:
      - quest_starving_family
      - quest_corrupt_official
    location: "marketplace_stall_1"
    ai-behavior:
      type: wanderer           # static | wanderer | patrol
      wander-radius: 15
      react-to-alignment: true
      hostile-to-evil: false   # Greedy NPCs sell to anyone

  # ── Captain Elena ──────────────────────────────────────────────────────────
  guard_captain:
    display-name: "Captain Elena"
    personality: Idealistic
    starting-relationship: 10
    dialogue-tree: guard_captain.yml
    quests:
      - quest_bandit_hunt
    location: "city_gates"
    ai-behavior:
      type: patrol
      patrol-path: city_perimeter
      wander-radius: 0
      react-to-alignment: true
      hostile-to-evil: true    # Will attack PURE_EVIL players on sight

  # ── Elder Mira ─────────────────────────────────────────────────────────────
  village_elder:
    display-name: "Elder Mira"
    personality: Noble
    starting-relationship: 20
    dialogue-tree: village_elder.yml
    quests:
      - quest_plague_village
      - quest_ancient_remedy
    location: "village_square"
    ai-behavior:
      type: static
      react-to-alignment: true
      hostile-to-evil: false   # Flees rather than attacks

  # ── Shade, the Rogue ───────────────────────────────────────────────────────
  rogue_shade:
    display-name: "Shade"
    personality: Pragmatic
    starting-relationship: -10
    dialogue-tree: rogue_shade.yml
    quests:
      - quest_bandit_hunt
    location: "tavern_back_room"
    ai-behavior:
      type: wanderer
      wander-radius: 25
      react-to-alignment: false  # Shade doesn't care about morality
      hostile-to-evil: false
