# ══════════════════════════════════════════════════════════════════════════════
# FableScript Sample Quest Definition — sample-quest-definition.yml
#
# NOTE: In FableScript 1.0, quests are defined in code via QuestManager.registerQuest()
# (see FablePlugin.registerDefaultQuests()). This YAML file is provided as a
# reference template for a future YAML-driven quest loader.
#
# Structure of a quest definition:
# ══════════════════════════════════════════════════════════════════════════════

quests:

  # ── The Forgotten Shrine ───────────────────────────────────────────────────
  quest_forgotten_shrine:
    title: "The Forgotten Shrine"
    description: >
      Deep in the forest, an ancient shrine has been defiled. A spirit pleads
      for your help. How you respond will define your legacy in these lands.
    giver-npc: village_elder
    min-alignment: -50     # Available to all but PURE_EVIL players
    max-alignment: 100
    prerequisites: []      # No prerequisites required
    resettable: false

    choices:
      - id: restore_shrine
        description: "Gather the sacred stones and restore the shrine."
        moral-path: GOOD
        alignment-delta: 18
        min-alignment: 0   # Only neutral+ can take the pure good path
        max-alignment: 100
        rewards:
          - type: EXPERIENCE
            value: "250"
            alignment-scaled: true
          - type: ABILITY_UNLOCK
            value: "holy_shield"
          - type: RELATIONSHIP
            value: "village_elder:20"
        consequence: "ENVIRONMENTAL_BLESSING:zone=forest_shrine"
        next-quest: quest_spirit_gratitude  # Unlocks a chain quest

      - id: harvest_power
        description: "Siphon the shrine's dark energy for personal power."
        moral-path: EVIL
        alignment-delta: -22
        min-alignment: -100
        max-alignment: -1  # Only evil-aligned players
        rewards:
          - type: GOLD
            value: "200"
            alignment-scaled: false
          - type: ABILITY_UNLOCK
            value: "corruption_wave"
        consequence: "ENVIRONMENTAL_CORRUPTION:zone=forest_shrine"

      - id: leave_alone
        description: "Leave the shrine as-is. Not your problem."
        moral-path: NEUTRAL
        alignment-delta: 0
        min-alignment: -100
        max-alignment: 100
        rewards:
          - type: GOLD
            value: "30"

  # ── Quest creation guide ───────────────────────────────────────────────────
  # FIELD REFERENCE:
  #
  # title:            Display name shown in /quest status
  # description:      Long-form text shown in /quest info
  # giver-npc:        NPC ID from npcs.yml (optional; null = world-triggered)
  # min-alignment:    Minimum player alignment to see this quest (-100 to 100)
  # max-alignment:    Maximum player alignment to see this quest (-100 to 100)
  # prerequisites:    List of quest IDs that must be completed first
  # resettable:       true = admin can reset via /fable reset-player
  #
  # choices[].id:               Unique identifier used in /quest choose <id>
  # choices[].description:      Player-visible option text
  # choices[].moral-path:       GOOD | NEUTRAL | EVIL
  # choices[].alignment-delta:  Points added on choosing (-25 to +25, capped by config)
  # choices[].min-alignment:    Minimum alignment to see this option
  # choices[].max-alignment:    Maximum alignment to see this option
  # choices[].rewards:          List of reward objects
  # choices[].consequence:      "TYPE:payload" string, or omit if none
  # choices[].next-quest:       Quest ID to unlock after completion, or omit
  #
  # REWARD TYPES:
  #   GOLD, EXPERIENCE, ITEM (value=itemId), ABILITY_UNLOCK (value=abilityId),
  #   RELATIONSHIP (value="npc_id:delta"), ALIGNMENT (bonus delta), TITLE (value=titleStr)
  #
  # CONSEQUENCE TYPES (must match ConsequenceTriggeredEvent.ConsequenceType):
  #   ENVIRONMENTAL_CORRUPTION, ENVIRONMENTAL_BLESSING, NPC_HOSTILITY_INCREASE,
  #   NPC_FRIENDLINESS_INCREASE, QUEST_STATE_CHANGE, ABILITY_UNLOCK, ABILITY_REVOKE,
  #   WORLD_MARKER_SET, BOUNTY_PLACED, BOUNTY_REMOVED
