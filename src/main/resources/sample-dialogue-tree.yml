# ══════════════════════════════════════════════════════════════════════════════
# FableScript Sample Dialogue Tree — merchant_thomas.yml
# Place this file in: plugins/FableScript/dialogues/merchant_thomas.yml
#
# Structure:
#   dialogue:
#     <node-id>:
#       text: "What the NPC says"
#       conditions:           # optional — restrict node visibility
#         min_alignment: -100
#         max_alignment: 100
#       choices:              # list of player response options
#         - id: unique_choice_id
#           text: "What the player says"
#           alignment_delta: 0   # positive = good, negative = evil
#           next_node: node_id   # navigate to this node (omit to end conversation)
#           consequence: "TYPE:payload"  # optional consequence trigger
# ══════════════════════════════════════════════════════════════════════════════

dialogue:

  # ── Entry node: shown to all alignments ────────────────────────────────────
  root:
    text: "Ah, a traveller! Welcome to Thomas's Emporium. What's your business?"
    conditions:
      min_alignment: -100
      max_alignment: 100
    choices:
      - id: browse_goods
        text: "I'm just browsing your wares."
        alignment_delta: 0
        next_node: node_shop
      - id: ask_family
        text: "I've heard about a starving family nearby..."
        alignment_delta: 0
        next_node: node_quest_intro
      - id: threaten
        text: "Hand over your gold. Now."
        alignment_delta: -8
        next_node: node_threatened
        consequence: "BOUNTY_PLACED:reason=extortion"
      - id: leave
        text: "Never mind. Good day."
        alignment_delta: 0

  # ── Shop branch ────────────────────────────────────────────────────────────
  node_shop:
    text: "Of course! I have the finest goods this side of the valley. Browse freely."
    choices:
      - id: buy_something
        text: "I'll take a look."
        alignment_delta: 0
        # TODO: Hook into Hytale shop API here via consequence
      - id: haggle
        text: "Any chance of a discount?"
        alignment_delta: 0
        next_node: node_haggle

  node_haggle:
    text: "Ha! You drive a hard bargain... Fine. 10% off, but don't tell the others."
    conditions:
      min_alignment: 20  # only GOOD or PURE_GOOD players get this option
    choices:
      - id: accept_deal
        text: "You're a fair man, Thomas."
        alignment_delta: 1
        consequence: "NPC_FRIENDLINESS_INCREASE:npc=merchant_thomas;delta=5"

  # ── Quest introduction branch ───────────────────────────────────────────────
  node_quest_intro:
    text: >
      "Yes, the Ashford family. Terrible situation — lost their harvest.
      I have some supplies I could spare... but I'm a businessman, not a charity.
      Perhaps you could help them in your own way?"
    choices:
      - id: offer_help
        text: "I'll find a way to help them. What do they need?"
        alignment_delta: 2
        next_node: node_quest_details
        consequence: "QUEST_STATE_CHANGE:quest_id=quest_starving_family;state=UNLOCK"
      - id: not_my_problem
        text: "Not my concern. Back to business."
        alignment_delta: -3
        next_node: node_shop

  node_quest_details:
    text: >
      "They need food for a week — say, ten silver pieces worth.
      Or you could take some of my stored grain — though I'd notice if it went missing.
      Or... there's a local lord who runs some questionable work programmes."
    choices:
      - id: understood
        text: "I understand. I'll figure it out."
        alignment_delta: 0

  # ── Threat response branch ─────────────────────────────────────────────────
  node_threatened:
    text: "Guards! GUARDS! Get away from me, you villain!"
    choices:
      - id: flee
        text: "(Flee the scene.)"
        alignment_delta: 0
      - id: attack
        text: "(Attack Thomas.)"
        alignment_delta: -5
        consequence: "NPC_HOSTILITY_INCREASE:zone=marketplace"
